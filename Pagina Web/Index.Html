<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion De Equipos de Futbol</title>
    <link rel="stylesheet" href="Index.css">
</head>
<header>
    <a href="Index.html" class="logo-link">
        <img src="/Proyecto-HU-1.1.1/sources/logo.png" alt="Logo" class="header-logo">
    </a>
    <div class="header-text">
        <h1>Gestion De Equipos de Futbol</h1>
        <h3>Dimayor</h3>
    </div>
</header>

<body>
    <main>
        <h2>Bienvenido a la gestion de equipos de futbol</h2>
        <p>En esta pagina podras registrar equipos de futbol.</p>
        <br>
        
        <!-- Sección de Registro -->
        <section class="registro-section">
            <h3>Registrar Nuevo Equipo</h3>
            <form id="teamForm">
                <div class="form-group">
                    <label for="teamName">Nombre del equipo:</label>
                    <input type="text" id="teamName" placeholder="Nombre del equipo">
                </div>
                <div class="form-group">
                    <label for="teamLogo">Logo del equipo: <span class="opcional">(Opcional)</span></label>
                    <input type="file" id="teamLogo" accept="image/*">
                </div>
                <button type="button" onclick="addTeam()">Agregar Equipo</button>
            </form>
        </section>

        <!-- Sección de Visualización y Búsqueda -->
        <section class="visualizacion-section">
            <h2>Equipos Registrados</h2>
            <div class="busqueda-section">
                <input type="text" id="searchTeam" placeholder="Buscar equipo por nombre..." onkeyup="searchTeams()">
                <button type="button" onclick="mostrarTodos()">Mostrar Todos</button>
            </div>
            <div id="teamList" class="team-grid"></div>
            <p id="noResults" class="no-results" style="display:none;">No se encontraron equipos con ese nombre.</p>
        </section>
    </main>
    
    <script src="Index.JS"></script>
</body>
</html>
