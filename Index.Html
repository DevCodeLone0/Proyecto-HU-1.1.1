<!DOCTYPE html>
<html Lang = "Es"></html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=chrome">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion De Equipos de Futbol</title>
    </head>
    
    <body>
    <h1>Gestion De Equipos de Futbol</h1>
    <h2>Bienvenido a la gestion de equipos de futbol</h2>
    <p>En esta pagina podras registrar equipos de futbol.</p>
    <p>Por favor ingrese el nombre del equipo</p>
    <input type="text" id="teamName" placeholder="Nombre del equipo">
    <button onclick="addTeam()">Agregar Equipo</button>

<head>
<body>
<h1>Equipos Registrados</h1>
<ul id="teamList"></ul>
<script>
    function addTeam() {
        var teamName = document.getElementById("teamName").value;
        if (teamName) {
            var teamList = document.getElementById("teamList");
            var listItem = document.createElement("li");
            listItem.textContent = teamName;
            teamList.appendChild(listItem);
            document.getElementById("teamName").value = ""; // Limpiar el campo de texto
        } else {
            alert("Por favor ingrese un nombre de equipo.");
        }
    }
